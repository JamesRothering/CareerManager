name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: autoapply
          POSTGRES_DB: autoapply
          POSTGRES_PASSWORD: autoapply-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autoapply -d autoapply"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      AUTOAPPLY_DB_HOST: localhost
      AUTOAPPLY_DB_PORT: "5432"
      AUTOAPPLY_DB_NAME: autoapply
      AUTOAPPLY_DB_USER: autoapply
      AUTOAPPLY_DB_PASSWORD: autoapply-ci
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Env file
        run: |
          cp config/.env.example .env
          echo "AUTOAPPLY_DB_PASSWORD=autoapply-ci" >> .env
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Init config
        run: uv run autoapply init --skip-llm --profile tests/fixtures/ci-profile.yaml
      - name: Migrate
        run: uv run alembic upgrade head
      - name: Test
        run: uv run pytest -q
