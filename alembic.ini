[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# Overwritten at runtime by migrations/env.py from AutoApply config / .env.
sqlalchemy.url = postgresql+psycopg://autoapply:autoapply@localhost:5432/autoapply

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
